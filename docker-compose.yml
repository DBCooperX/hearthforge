# Hearthforge: self-hosted D&D with an AI Dungeon Master.
# Copy .env.example to .env, add your API key, then: docker compose up -d --build
services:
  hearthforge:
    build: .
    image: hearthforge:local
    container_name: hearthforge
    restart: unless-stopped
    ports:
      - "${HEARTHFORGE_PORT:-3000}:3000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HEARTHFORGE_DM_MODEL_BACKGROUND: ${HEARTHFORGE_DM_MODEL_BACKGROUND:-}
      HEARTHFORGE_DM_MODEL_STANDARD: ${HEARTHFORGE_DM_MODEL_STANDARD:-}
      HEARTHFORGE_DM_MODEL_KEY: ${HEARTHFORGE_DM_MODEL_KEY:-}
      HEARTHFORGE_DM_FORCE_MODEL: ${HEARTHFORGE_DM_FORCE_MODEL:-}
      HEARTHFORGE_DM_EFFORT: ${HEARTHFORGE_DM_EFFORT:-low}
      HEARTHFORGE_ART: ${HEARTHFORGE_ART:-generated}
      HEARTHFORGE_ART_UPLOADS: ${HEARTHFORGE_ART_UPLOADS:-on}
      HEARTHFORGE_MUSIC: ${HEARTHFORGE_MUSIC:-on}
      HEARTHFORGE_SFX: ${HEARTHFORGE_SFX:-on}
      HEARTHFORGE_TURN_WAIT: ${HEARTHFORGE_TURN_WAIT:-8}
      HEARTHFORGE_REACTION_WAIT: ${HEARTHFORGE_REACTION_WAIT:-20}
      HEARTHFORGE_KENNEY_URL: ${HEARTHFORGE_KENNEY_URL:-}
      HEARTHFORGE_0X72_URL: ${HEARTHFORGE_0X72_URL:-}
      # The owner's panel (Innkeeper). The password here is only the first one; change it in the panel.
      HEARTHFORGE_ADMIN: ${HEARTHFORGE_ADMIN:-on}
      HEARTHFORGE_ADMIN_PASSWORD: ${HEARTHFORGE_ADMIN_PASSWORD:-}
      HEARTHFORGE_AUTO_UPDATE: ${HEARTHFORGE_AUTO_UPDATE:-off}
      HEARTHFORGE_TRUST_PROXY: ${HEARTHFORGE_TRUST_PROXY:-off}
    volumes:
      - hearthforge-data:/data

  # Lets the Innkeeper update Hearthforge from GitHub with one click. It talks to Docker on
  # this host, which is why it is a container of its own: it opens no port and only acts on
  # the words "check" and "update" that the game leaves in the data volume. Remove this
  # service if you would rather update by hand (git pull && docker compose up -d --build).
  updater:
    build: ./updater
    image: hearthforge-updater:local
    restart: unless-stopped
    # Started after the game, so a new data volume is set up by the game.
    depends_on:
      - hearthforge
    environment:
      HEARTHFORGE_BRANCH: ${HEARTHFORGE_BRANCH:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/repo
      - hearthforge-data:/data

volumes:
  hearthforge-data:
